# QEMU user networking (slirp): guest 10.0.2.15 via DHCP, host loopback at 10.0.2.2
CONFIG_NET_QEMU_USER=y
CONFIG_ETH_E1000=y
CONFIG_E2E_SLOT0_HEADER=y
CONFIG_UPDATEHUB_SERVER="10.0.2.2"
CONFIG_HW_STACK_PROTECTION=y
# No wall clock under QEMU: with date checks on, every certificate is "not yet valid"
CONFIG_MBEDTLS_HAVE_TIME_DATE=n
